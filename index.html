<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        .header h1 small { font-size:14px; font-weight:400; color:#5f7d9c; -webkit-text-fill-color:#5f7d9c; }
        .tab-bar { display:flex; gap:4px; background:rgba(255,255,255,0.5); padding:4px; border-radius:40px; border:1px solid rgba(255,255,255,0.8); margin-left:auto; }

        .tab-btn.active { background:#1a6bb0; color:#fff; box-shadow:0 2px 8px rgba(26,107,176,0.25); }
        .tab-btn:hover:not(.active) { background:rgba(255,255,255,0.6); }
        .tab-btn.rules-tab { background:linear-gradient(135deg,#8b5cf6,#7c3aed); color:#fff; box-shadow:0 2px 8px rgba(124,58,237,0.25); }
        .tab-btn.rules-tab:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(124,58,237,0.35); }
        .tab-btn.rules-tab.active { background:linear-gradient(135deg,#7c3aed,#6d28d9); box-shadow:0 2px 12px rgba(124,58,237,0.4); }

        .search-results .item .name .highlight { background:#ffeb3b; color:#000; }

        .btn { padding:8px 20px; border-radius:40px; border:none; font-weight:500; font-size:14px; cursor:pointer; transition:0.2s; display:inline-flex; align-items:center; gap:6px; background:rgba(238,243,248,0.8); backdrop-filter:blur(4px); color:#1a3a5c; border:1px solid rgba(255,255,255,0.3); }

        .btn-success:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(15,123,62,0.35); }

        .footer-row .col-price { width:72px; min-width:65px; max-width:80px; }

        .editable-input { border:1px solid transparent; background:transparent; padding:4px 6px; border-radius:6px; font-size:13px; width:100%; transition:0.15s; color:#1e293b; }

        .master-search input:focus { border-color:#1a6bb0; background:#fff; box-shadow:0 0 0 3px rgba(26,107,176,0.08); }

        .scheme-toolbar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }

        .filter-group { display:inline-flex; gap:3px; margin-left:10px; background:rgba(255,255,255,0.5); padding:3px; border-radius:30px; border:1px solid rgba(255,255,255,0.7); flex-wrap:wrap; }
        .filter-btn { padding:4px 14px; border:none; background:transparent; border-radius:30px; font-size:12px; font-weight:500; cursor:pointer; transition:0.2s; color:#5f7d9c; white-space:nowrap; }
        .filter-btn.active { background:#1a6bb0; color:#fff; box-shadow:0 2px 8px rgba(26,107,176,0.25); }
        .filter-btn:hover:not(.active) { background:rgba(255,255,255,0.6); }
        .filter-btn.filter-male.active { background:#1a5a9c; }
        .filter-btn.filter-female.active { background:#b13a7a; }
        .filter-btn.filter-fm.active { background:#8e2a5e; }
        .filter-count { font-size:11px; color:#7a95b0; margin-left:2px; font-weight:400; }
        .filter-btn.active .filter-count { color:rgba(255,255,255,0.7); }
        .rules-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(6px); z-index:99999; display:none; align-items:center; justify-content:center; padding:20px; }
        .rules-overlay.show { display:flex; }
        .rules-modal { background:#fff; border-radius:24px; max-width:960px; width:100%; max-height:85vh; display:flex; flex-direction:column; box-shadow:0 24px 80px rgba(0,0,0,0.3); animation:modalIn 0.3s ease; }
        @keyframes modalIn { from { opacity:0; transform:scale(0.95) translateY(20px); } to { opacity:1; transform:scale(1) translateY(0); } }
        .rules-modal-header { display:flex; justify-content:space-between; align-items:center; padding:20px 28px 16px 28px; border-bottom:2px solid #f1f5f9; flex-shrink:0; }
        .rules-modal-header h3 { font-size:20px; font-weight:600; color:#1a3a5c; display:flex; align-items:center; gap:10px; }
        .rules-modal-header h3 .icon-rules { color:#7c3aed; }

        .rules-modal-close:hover { background:#e2e8f0; color:#1e293b; }

        .rules-modal-body table.rules-table th { background:#f7fafc; color:#1a3a5c; font-weight:600; padding:10px 14px; text-align:left; border-bottom:2px solid #d0d9e5; font-size:12px; letter-spacing:0.3px; position:sticky; top:0; z-index:5; }

        .rules-modal-body table.rules-table tr:last-child td { border-bottom:none; }
        .rules-modal-body table.rules-table .code-cell { font-family:monospace; font-size:12px; color:#607d8b; white-space:nowrap; }
        .rules-modal-body table.rules-table .name-cell { font-weight:500; }
        .rules-modal-body table.rules-table .rule-cell { color:#334155; }
        .rules-modal-body table.rules-table .tag-required { display:inline-block; background:#fef3c7; color:#9b6b0a; font-size:10px; padding:1px 10px; border-radius:30px; font-weight:500; margin-left:6px; }
        .rules-modal-body table.rules-table .tag-optional { display:inline-block; background:#e5eff9; color:#1a5a9c; font-size:10px; padding:1px 10px; border-radius:30px; font-weight:500; margin-left:6px; }

        .rules-modal-body .rules-note strong { color:#1a3a5c; }

        html, body { height:100vh; margin:0; padding:0; overflow:hidden; }
        .container { display:flex; flex-direction:column; height:100vh; overflow:hidden; padding:20px 16px 80px; }
        .tab-content { display:none; flex-direction:column; flex:1; overflow:hidden; }
        .tab-content.active { display:flex !important; }
        .tab-content .card { display:flex; flex-direction:column; flex:1; overflow:hidden; padding-bottom:8px; }

<body>
<div class="container">
    <div class="brand-badge-bottom">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><circle cx='18' cy='18' r='18' fill='%23b0b8c4'/></svg>" alt="头像">
        <span>出品</span>
        <span class="divider">·</span>
        <span>原创专属</span>
        <span class="divider">·</span>
        <span>未经许可禁止使用</span>
        <span class="icon">🔒</span>
    </div>

    <div class="header">
        <h1><span class="icon-med">🧬</span> 美年大健康 · 智能体检套餐 <small>石家庄</small></h1>
        <div class="tab-bar">
            <button class="tab-btn active" data-tab="package">📋 套餐定制</button>
            <button class="tab-btn rules-tab" id="rulesTabBtn">📋 必加项规则</button>
            <button class="tab-btn" data-tab="master">📚 项目总表</button>
        </div>
    </div>

    <div id="tab-package" class="tab-content active">
        <div class="card">
            <div class="card-header">
                <div style="display:flex; align-items:center; flex-wrap:wrap; gap:8px;">
                    <span class="icon-header">📋</span>
                    <span style="font-size:20px; font-weight:600; color:#1a3a5c;">套餐定制</span>
                    <span class="badge" id="selectedCount">已选 0 项</span>
                    <span class="filter-group" id="filterGroup">
                        <button class="filter-btn active" data-filter="all">全部 <span class="filter-count" id="filterAllCount"></span></button>
                        <button class="filter-btn filter-male" data-filter="male">👨 男 <span class="filter-count" id="filterMaleCount"></span></button>
                        <button class="filter-btn filter-female" data-filter="female">👩 未婚 <span class="filter-count" id="filterFemaleCount"></span></button>
                        <button class="filter-btn filter-fm" data-filter="femaleMarried">👩 已婚 <span class="filter-count" id="filterFmCount"></span></button>
                    </span>
                </div>
                <div class="search-box" style="flex:1; min-width:200px; margin:0 10px;">
                    <span class="icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="点击输入框显示全部 · 输入模糊搜索" autocomplete="off">
                    <div class="search-results" id="searchResults"></div>
                </div>
                <div style="display:flex; align-items:center; flex-wrap:wrap; gap:6px;">
                    <div class="scheme-toolbar">

function getMandatoryItems() { return MANDATORY_ITEMS; }
function filterByGender(items) {
    if (currentGenderFilter === 'all') return items;
    return items.filter(item => {
        if (currentGenderFilter === 'male') return item.priceM !== null && item.priceM !== undefined;
        if (currentGenderFilter === 'female') return item.priceF !== null && item.priceF !== undefined;
        if (currentGenderFilter === 'femaleMarried') return item.priceFM !== null && item.priceFM !== undefined;
        return true;
    });
}
function showToast(message, type) {
    type = type || 'info';
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast-item ' + type;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(40px)'; setTimeout(() => toast.remove(), 300); }, 3000);
}
function calculateTotals(items) { let m=0,f=0,fa=0; items.forEach(item=>{ if(item.priceM!==null&&item.priceM!==undefined) m+=item.priceM; if(item.priceF!==null&&item.priceF!==undefined) f+=item.priceF; if(item.priceFM!==null&&item.priceFM!==undefined) fa+=item.priceFM; }); return {male:m, female:f, femaleMarried:fa}; }
function calculateNoDiscountTotals(items) { let m=0,f=0,fa=0; items.forEach(item=>{ if(isNoDiscount(item)){ if(item.priceM!==null&&item.priceM!==undefined) m+=item.priceM; if(item.priceF!==null&&item.priceF!==undefined) f+=item.priceF; if(item.priceFM!==null&&item.priceFM!==undefined) fa+=item.priceFM; } }); return {male:m, female:f, femaleMarried:fa}; }

// ===== 默认加载 =====
function loadDefaultSelection() {
    const newSelected = [];
    DEFAULT_SELECTED_IDS.forEach(id => {
        const item = projects.find(p => p.id === id);
        if (item) newSelected.push(item.uid);
    });
    selectedIds = newSelected;
    currentSchemeName = null;
    document.getElementById('schemeSelect').value = '';
    renderPackage();
}

// ===== 方案管理 =====
function getSchemes() { try { return JSON.parse(localStorage.getItem('packageSchemes') || '{}'); } catch(e) { return {}; } }
function saveSchemes(schemes) { localStorage.setItem('packageSchemes', JSON.stringify(schemes)); }
function updateSchemeSelect() {
    const select = document.getElementById('schemeSelect');
    const schemes = getSchemes();
    select.innerHTML = '<option value="">加载方案</option>';
    Object.keys(schemes).forEach(name => { const opt = document.createElement('option'); opt.value = name; opt.textContent = name; select.appendChild(opt); });
    if (currentSchemeName && schemes[currentSchemeName]) select.value = currentSchemeName;
    else select.value = '';
}
function loadScheme(name) {
    const schemes = getSchemes();
    const data = schemes[name];
    if (!data) { showToast('方案 "' + name + '" 不存在', 'info'); return; }
    if (data.selectedIds && Array.isArray(data.selectedIds)) {
        const newSelected = [];
        data.selectedIds.forEach(id => {
            const item = findItemById(id);
            if (item) newSelected.push(item.uid);
        });
        selectedIds = newSelected;
    }
    if (data.discountMale !== undefined) document.getElementById('discountMale').value = data.discountMale;
    if (data.discountFemale !== undefined) document.getElementById('discountFemale').value = data.discountFemale;
    if (data.discountFemaleMarried !== undefined) document.getElementById('discountFemaleMarried').value = data.discountFemaleMarried;
    currentSchemeName = name;
    updateSchemeSelect();
    renderPackage();
}
function saveCurrentScheme(name) {
    const schemes = getSchemes();
    if (schemes[name]) { if (!confirm('方案 "' + name + '" 已存在，是否覆盖？')) return; }
    const idList = selectedIds.map(uid => {
        const item = findItem(uid);
        return item ? item.id : null;
    }).filter(id => id !== null);
    schemes[name] = {
        selectedIds: idList,
        discountMale: document.getElementById('discountMale').value || '',
        discountFemale: document.getElementById('discountFemale').value || '',
        discountFemaleMarried: document.getElementById('discountFemaleMarried').value || ''
    };
    saveSchemes(schemes);
    loadDefaultSelection();
    updateSchemeSelect();
    CloudSync.scheduleSave(getAppState());
}
function deleteScheme(name) {
    if (!name) { alert('请先选择一个方案'); return; }
    const schemes = getSchemes();
    if (!schemes[name]) { alert('方案 "' + name + '" 不存在'); return; }
    if (!confirm('确定删除方案 "' + name + '" 吗？')) return;
    delete schemes[name];
    saveSchemes(schemes);
    if (currentSchemeName === name) currentSchemeName = null;
    updateSchemeSelect();
    showToast('已删除方案：' + name, 'info');
    CloudSync.scheduleSave(getAppState());
}

// ===== 获取/应用云端状态（修复自动同步） =====
function getAppState() {
    const selectedIdList = selectedIds.map(uid => {
        const item = findItem(uid);
        return item ? item.id : null;
    }).filter(id => id !== null);
    return {
        projects: projects.map(p => ({...p})),
        selectedIds: selectedIdList,
        discounts: {
            male: document.getElementById('discountMale')?.value || '',
            female: document.getElementById('discountFemale')?.value || '',
            femaleMarried: document.getElementById('discountFemaleMarried')?.value || ''
        },
        schemes: getSchemes()
    };
}

function applyAppState(state) {
    if (!state) return false;

    // ---- 变化检测 ----
    // 1. 检测 projects 是否变化（忽略 uid，按 id 排序比较）
    const currentProjectsStr = JSON.stringify(
        projects.map(p => {
            const { uid, ...rest } = p;
            return rest;
        }).sort((a, b) => a.id.localeCompare(b.id))
    );
    const incomingProjectsStr = JSON.stringify(
        (state.projects || []).map(p => {
            const { uid, ...rest } = p;
            return rest;
        }).sort((a, b) => a.id.localeCompare(b.id))
    );

    // 2. 检测 selectedIds 是否变化（转为 id 列表并排序）
    const currentSelectedIdsStr = JSON.stringify(
        selectedIds.map(uid => findItem(uid)?.id).filter(id => id).sort()
    );
    const incomingSelectedIdsStr = JSON.stringify(
        (state.selectedIds || []).slice().sort()
    );

    // 3. 检测 discounts 是否变化
    const currentDiscountsStr = JSON.stringify({
        male: document.getElementById('discountMale')?.value || '',
        female: document.getElementById('discountFemale')?.value || '',
        femaleMarried: document.getElementById('discountFemaleMarried')?.value || ''
    });
    const incomingDiscountsStr = JSON.stringify(
        state.discounts || { male: '', female: '', femaleMarried: '' }
    );

    // 4. 检测 schemes 是否变化
    const currentSchemesStr = JSON.stringify(getSchemes());
    const incomingSchemesStr = JSON.stringify(state.schemes || {});

    // 如果所有数据都相同，则无需更新
    if (currentProjectsStr === incomingProjectsStr &&
        currentSelectedIdsStr === incomingSelectedIdsStr &&
        currentDiscountsStr === incomingDiscountsStr &&
        currentSchemesStr === incomingSchemesStr) {
        return false;
    }

    // ---- 数据有变化，执行更新 ----
    let needRender = false;

    // 处理 projects
    if (state.projects && Array.isArray(state.projects)) {
        const oldSelectedIds = selectedIds.map(uid => {
            const item = findItem(uid);
            return item ? item.id : null;
        }).filter(id => id !== null);
        projects = JSON.parse(JSON.stringify(state.projects));
        projects.forEach((p, idx) => { p.uid = p.id + '_' + idx; });
        let newSelectedIds = [];
        if (state.selectedIds && Array.isArray(state.selectedIds) && state.selectedIds.length > 0) {
            state.selectedIds.forEach(id => {
                const found = projects.find(p => p.id === id);
                if (found) newSelectedIds.push(found.uid);
            });
        }
        if (newSelectedIds.length === 0) {
            oldSelectedIds.forEach(id => {
                const found = projects.find(p => p.id === id);
                if (found) newSelectedIds.push(found.uid);
            });
        }
        if (newSelectedIds.length === 0) {
            DEFAULT_SELECTED_IDS.forEach(id => {
                const found = projects.find(p => p.id === id);
                if (found) newSelectedIds.push(found.uid);
            });
        }
        selectedIds = newSelectedIds;
        needRender = true;
    }

    // 处理 discounts
    if (state.discounts) {
        setTimeout(() => {
            const dm = document.getElementById('discountMale');
            const df = document.getElementById('discountFemale');
            const dfm = document.getElementById('discountFemaleMarried');
            if (dm) dm.value = state.discounts.male || '';
            if (df) df.value = state.discounts.female || '';
            if (dfm) dfm.value = state.discounts.femaleMarried || '';
            renderPackageFooter();
        }, 50);
        needRender = true;
    }

    // 处理 schemes
    if (state.schemes) {
        saveSchemes(state.schemes);
        updateSchemeSelect();
        needRender = true;
    }

    // 刷新界面
    if (needRender) {
        renderMaster(document.getElementById('masterSearchInput').value);
        renderPackage();
    }

    return true; // 表示已更新
}

function renderPackageBody() {
    const tbody = document.getElementById('packageBody');
    let selectedItems = selectedIds.map(uid=>findItem(uid)).filter(Boolean);
    const filteredItems = filterByGender(selectedItems);
    const totalSelected = selectedItems.length;
    const filteredCount = filteredItems.length;
    let countDisplay = `已选 ${totalSelected} 项`;
    if (currentGenderFilter !== 'all') {
        const label = { male:'男', female:'未婚女', femaleMarried:'已婚女' }[currentGenderFilter] || '';
        countDisplay += ` · 筛选 ${label} ${filteredCount} 项`;
    }
    document.getElementById('selectedCount').textContent = countDisplay;
    const allCount = selectedItems.length;
    const maleCount = selectedItems.filter(i => i.priceM !== null && i.priceM !== undefined).length;
    const femaleCount = selectedItems.filter(i => i.priceF !== null && i.priceF !== undefined).length;
    const fmCount = selectedItems.filter(i => i.priceFM !== null && i.priceFM !== undefined).length;
    document.getElementById('filterAllCount').textContent = allCount;
    document.getElementById('filterMaleCount').textContent = maleCount;
    document.getElementById('filterFemaleCount').textContent = femaleCount;
    document.getElementById('filterFmCount').textContent = fmCount;

    let html = '';
    if(filteredItems.length===0) {
        html = `<tr><td colspan="9" class="empty-state">暂无项目，请从上方搜索添加</td></tr>`;
    } else {
        filteredItems.forEach((item,idx)=>{
            const itemsStr = Array.isArray(item.items) ? item.items.join('、') : item.items||'';
            const noDisc = isNoDiscount(item);
            let displayId = item.id;
            if (item.name === '营养早餐' && item.remark === '满赠') displayId = 'GP230303406';
            const showM = (currentGenderFilter === 'all' || currentGenderFilter === 'male');
            const showF = (currentGenderFilter === 'all' || currentGenderFilter === 'female');
            const showFM = (currentGenderFilter === 'all' || currentGenderFilter === 'femaleMarried');
            const priceMVal = (item.priceM !== null && item.priceM !== undefined) ? item.priceM : '';
            const priceFVal = (item.priceF !== null && item.priceF !== undefined) ? item.priceF : '';
            const priceFMVal = (item.priceFM !== null && item.priceFM !== undefined) ? item.priceFM : '';
            html += `<tr>
                <td class="col-index">${idx+1}</td>
                <td class="col-code">${displayId}</td>
                <td class="col-name">${item.name}${noDisc?' <span class="no-discount-tag">无折扣</span>':''}</td>
                <td class="col-items">${itemsStr}</td>
                <td class="col-meaning">${item.meaning||''}</td>
                <td class="col-price price-male" style="${showM?'':'opacity:0.3;'}"><input class="price-input-sm" type="text" value="${priceMVal}" data-uid="${item.uid}" data-gender="M" oninput="updatePrice(this)" placeholder="-"></td>
                <td class="col-price price-female" style="${showF?'':'opacity:0.3;'}"><input class="price-input-sm" type="text" value="${priceFVal}" data-uid="${item.uid}" data-gender="F" oninput="updatePrice(this)" placeholder="-"></td>
                <td class="col-price price-female" style="${showFM?'':'opacity:0.3;'}"><input class="price-input-sm" type="text" value="${priceFMVal}" data-uid="${item.uid}" data-gender="FM" oninput="updatePrice(this)" placeholder="-"></td>
                <td class="col-action"><button class="btn btn-danger btn-sm" onclick="removeSelected('${item.uid}')">✕</button></td>
            </tr>`;
        });
    }
    tbody.innerHTML = html;
}

let footerUpdateTimer = null;
function renderPackageFooter() {
    if(footerUpdateTimer) clearTimeout(footerUpdateTimer);
    footerUpdateTimer = setTimeout(()=>{
        const tfoot = document.getElementById('packageFoot');
        let selectedItems = selectedIds.map(uid=>findItem(uid)).filter(Boolean);
        let mandatory = getMandatoryItems();
        let freeItems = FREE_ITEMS;
        const filteredSelected = filterByGender(selectedItems);
        const filteredMandatory = filterByGender(mandatory);
        const filteredFree = filterByGender(freeItems);
        const allItems = [...filteredSelected, ...filteredMandatory, ...filteredFree];
        const discMaleEl = document.getElementById('discountMale');
        const discFemaleEl = document.getElementById('discountFemale');
        const discFemaleMarriedEl = document.getElementById('discountFemaleMarried');
        const prevMaleVal = discMaleEl ? discMaleEl.value : '';
        const prevFemaleVal = discFemaleEl ? discFemaleEl.value : '';
        const prevFemaleMarriedVal = discFemaleMarriedEl ? discFemaleMarriedEl.value : '';
        const focusedId = document.activeElement ? document.activeElement.id : '';

        // ★★★ 修复：特殊项目统计基于 selectedItems 实时计算 ★★★
        let specialMaleCount = 0, specialFemaleCount = 0, specialFemaleMarriedCount = 0;
        selectedItems.forEach(item => {
            if (item.remark && item.remark.includes('特殊项目')) {
                if (item.priceM !== null && item.priceM !== undefined) specialMaleCount++;
                if (item.priceF !== null && item.priceF !== undefined) specialFemaleCount++;
                if (item.priceFM !== null && item.priceFM !== undefined) specialFemaleMarriedCount++;
            }
        });

        let footerHtml = '';
        filteredMandatory.forEach((item,idx)=>{
            const itemsStr = Array.isArray(item.items)?item.items.join('、'):item.items||'';
            footerHtml += `<tr class="footer-row-mandatory">
                <td class="col-index">${filteredSelected.length+idx+1}</td>
                <td class="col-code">${item.id}</td>
                <td class="col-name">${item.name}</td>
                <td class="col-items">${itemsStr}</td>
                <td class="col-meaning">${item.meaning||''}</td>
                <td class="col-price price-male">${item.priceM!==null?'¥'+item.priceM:'-'}</td>
                <td class="col-price price-female">${item.priceF!==null?'¥'+item.priceF:'-'}</td>
                <td class="col-price price-female">${item.priceFM!==null?'¥'+item.priceFM:'-'}</td>
                <td class="col-action">—</td>
            </tr>`;
        });
        const freeStartIdx = filteredSelected.length + filteredMandatory.length;
        filteredFree.forEach((item,idx)=>{
            const itemsStr = Array.isArray(item.items)?item.items.join('、'):item.items||'';
            let displayId = item.id;
            if (item.name === '营养早餐' && item.remark === '满赠') displayId = 'GP230303406';
            footerHtml += `<tr class="footer-row-free">
                <td class="col-index">${freeStartIdx+idx+1}</td>
                <td class="col-code">${displayId}</td>
                <td class="col-name">${item.name}</td>
                <td class="col-items">${itemsStr}</td>
                <td class="col-meaning">${item.meaning||''}</td>
                <td class="col-price price-male">¥0</td>
                <td class="col-price price-female">¥0</td>
                <td class="col-price price-female">¥0</td>
                <td class="col-action">—</td>
            </tr>`;
        });
        const totals = calculateTotals(allItems);
        const noDiscTotals = calculateNoDiscountTotals(allItems);
        footerHtml += `<tr class="footer-row footer-row-total" style="background:#f4f8fe !important;">
            <td colspan="5" style="text-align:right;font-weight:700;">无折扣项目总价</td>
            <td class="col-price price-male">¥${noDiscTotals.male.toFixed(2)}</td>
            <td class="col-price price-female">¥${noDiscTotals.female.toFixed(2)}</td>
            <td class="col-price price-female">¥${noDiscTotals.femaleMarried.toFixed(2)}</td>
            <td class="col-action"></td>
        </tr>`;
        footerHtml += `<tr class="footer-row footer-row-total">
            <td colspan="5" style="text-align:right;font-weight:700;">门市价合计</td>
            <td class="col-price price-male">¥${totals.male.toFixed(2)}</td>
            <td class="col-price price-female">¥${totals.female.toFixed(2)}</td>
            <td class="col-price price-female">¥${totals.femaleMarried.toFixed(2)}</td>
            <td class="col-action"></td>
        </tr>`;
        // ★★★ 特殊项目行（使用最新统计） ★★★
        footerHtml += `<tr class="footer-row footer-row-special">
            <td colspan="5" style="text-align:right;font-weight:600; color: #5b21b6;">特殊项目</td>
            <td class="col-price price-male" style="color:#1a5a9c;">${specialMaleCount}</td>
            <td class="col-price price-female" style="color:#b13a7a;">${specialFemaleCount}</td>
            <td class="col-price price-female" style="color:#8e2a5e;">${specialFemaleMarriedCount}</td>
            <td class="col-action"></td>
        </tr>`;
        footerHtml += `<tr class="footer-row footer-row-discount">
            <td colspan="5" style="text-align:right;font-weight:700;">优惠价（输入）</td>
            <td class="col-price"><input type="text" id="discountMale" value="${prevMaleVal}" style="width:85px;text-align:center;direction:ltr;" oninput="this.value=this.value.replace(/[^0-9.]/g,''); renderPackageFooter(); CloudSync.scheduleSave(getAppState());"></td>
            <td class="col-price"><input type="text" id="discountFemale" value="${prevFemaleVal}" style="width:85px;text-align:center;direction:ltr;" oninput="this.value=this.value.replace(/[^0-9.]/g,''); renderPackageFooter(); CloudSync.scheduleSave(getAppState());"></td>
            <td class="col-price"><input type="text" id="discountFemaleMarried" value="${prevFemaleMarriedVal}" style="width:85px;text-align:center;direction:ltr;" oninput="this.value=this.value.replace(/[^0-9.]/g,''); renderPackageFooter(); CloudSync.scheduleSave(getAppState());"></td>
            <td class="col-action"></td>
        </tr>`;
        const discMale = parseFloat(prevMaleVal)||0;
        const discFemale = parseFloat(prevFemaleVal)||0;
        const discFemaleMarried = parseFloat(prevFemaleMarriedVal)||0;
        const calcRate = (disc,total,noDisc)=>{ const base=total-noDisc; if(base===0)return 0; const eff=disc-noDisc; if(eff<0)return 0; return eff/base; };
        const rateMale=calcRate(discMale,totals.male,noDiscTotals.male);
        const rateFemale=calcRate(discFemale,totals.female,noDiscTotals.female);
        const rateFemaleMarried=calcRate(discFemaleMarried,totals.femaleMarried,noDiscTotals.femaleMarried);
        const fmtRate=r=>{ if(r===0)return '0%'; return (r*100).toFixed(2)+'%'; };
        footerHtml += `<tr class="footer-row footer-row-discount">
            <td colspan="5" style="text-align:right;font-weight:700;">折扣</td>
            <td class="col-price price-male discount-rate ${rateMale>=0.5?'good':'bad'}">${fmtRate(rateMale)}</td>
            <td class="col-price price-female discount-rate ${rateFemale>=0.5?'good':'bad'}">${fmtRate(rateFemale)}</td>
            <td class="col-price price-female discount-rate ${rateFemaleMarried>=0.5?'good':'bad'}">${fmtRate(rateFemaleMarried)}</td>
            <td class="col-action"></td>
        </tr>`;
        tfoot.innerHTML = footerHtml;
        if (focusedId === 'discountMale' || focusedId === 'discountFemale' || focusedId === 'discountFemaleMarried') {
            setTimeout(() => {
                const el = document.getElementById(focusedId);
                if (el) {
                    el.focus();
                    el.setSelectionRange(el.value.length, el.value.length);
                }
            }, 0);
        }
        footerUpdateTimer = null;
    }, 0); // 延迟0，确保立即刷新
}
function renderPackage(){ renderPackageBody(); renderPackageFooter(); }

function removeSelected(uid){
    const item = findItem(uid);
    selectedIds = selectedIds.filter(pid=>pid!==uid);
    renderPackage();
    if (item) showToast('已移除：' + item.name, 'info');
    CloudSync.scheduleSave(getAppState());
}
function addItemByUid(uid) {
    if (!selectedIds.includes(uid)) {
        const item = findItem(uid);
        selectedIds.push(uid);
        renderPackage();
        if (item) showToast('已添加：' + item.name, 'success');
        CloudSync.scheduleSave(getAppState());
    } else {
        alert('项目已添加');
    }
}
function updatePrice(input) {
    const uid = input.dataset.uid;
    const gender = input.dataset.gender;
    const val = parseFloat(input.value);
    const item = projects.find(p => p.uid === uid);
    if (!item) return;
    const num = isNaN(val) ? null : val;
    if(gender === 'M') item.priceM = num;
    else if(gender === 'F') item.priceF = num;
    else if(gender === 'FM') item.priceFM = num;
    renderPackageFooter();
    CloudSync.scheduleSave(getAppState());
}
function setGenderFilter(filter) {
    currentGenderFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
    });
    renderPackage();
    document.getElementById('thMale').style.opacity = (filter === 'all' || filter === 'male') ? '1' : '0.35';
    document.getElementById('thFemale').style.opacity = (filter === 'all' || filter === 'female') ? '1' : '0.35';
    document.getElementById('thFemaleMarried').style.opacity = (filter === 'all' || filter === 'femaleMarried') ? '1' : '0.35';
}

    let filtered = projects;

        const q = filter.toLowerCase();
        filtered = projects.filter(p=>p.name.toLowerCase().includes(q)||(p.id&&p.id.toLowerCase().includes(q))||(Array.isArray(p.items)&&p.items.some(i=>i.toLowerCase().includes(q))));
    }
    document.getElementById('masterCount').textContent = `共 ${filtered.length} 项`;
    let html='';
    filtered.forEach((item,idx)=>{
        const itemsStr = Array.isArray(item.items)?item.items.join('、'):item.items||'';
        html += `<tr>
            <td class="col-index">${idx+1}</td>
            <td class="col-code"><input class="editable-input" data-field="id" data-uid="${item.uid}" value="${item.id}" style="font-size:12px;width:100%;"></td>

            <td class="col-price"><input class="editable-input price-input" data-field="priceM" data-uid="${item.uid}" value="${item.priceM!==null&&item.priceM!==undefined?item.priceM:''}" style="width:60px;"></td>
            <td class="col-price"><input class="editable-input price-input" data-field="priceF" data-uid="${item.uid}" value="${item.priceF!==null&&item.priceF!==undefined?item.priceF:''}" style="width:60px;"></td>
            <td class="col-price"><input class="editable-input price-input" data-field="priceFM" data-uid="${item.uid}" value="${item.priceFM!==null&&item.priceFM!==undefined?item.priceFM:''}" style="width:60px;"></td>

            <td class="col-action"><button class="btn btn-danger btn-sm" onclick="deleteProject('${item.uid}')">✕</button></td>
        </tr>`;
    });
    tbody.innerHTML = html;
    document.querySelectorAll('#masterBody .editable-input').forEach(input=>{

            else { item[field]=val; }
            renderPackage();
            renderMaster(document.getElementById('masterSearchInput').value);
            CloudSync.scheduleSave(getAppState());
        });
    });

// ===== 搜索框 =====
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
let searchItems = [];
let activeIndex = -1;
function renderSearchResults(query) {
    const all = getAllItems();
    let matches = all.filter(item => {
        if(item.id && item.id.startsWith('free_')) return false;
        if(selectedIds.includes(item.uid)) return false;
        if(!hasPrice(item)) return false;
        const q = query.toLowerCase().trim();
        if(!q) return true;
        return item.name.toLowerCase().includes(q) || (item.id && item.id.toLowerCase().includes(q)) || (Array.isArray(item.items)&&item.items.some(i=>i.toLowerCase().includes(q)));
    });
    searchItems = matches;
    activeIndex = -1;
    if(matches.length===0) {
        searchResults.innerHTML = `<div class="item" style="color:#7a95b0;cursor:default;justify-content:center;background:transparent;border:none;">没有匹配的项目</div>`;
        return;
    }
    let html = '';
    const q = query.trim().toLowerCase();
    matches.forEach(item => {
        const priceStr = [];
        if(item.priceM!==null&&item.priceM!==undefined) priceStr.push(`男¥${item.priceM}`);
        if(item.priceF!==null&&item.priceF!==undefined) priceStr.push(`未婚¥${item.priceF}`);
        if(item.priceFM!==null&&item.priceFM!==undefined) priceStr.push(`已婚¥${item.priceFM}`);
        let nameDisplay = item.name;
        if (q) {
            const regex = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
            nameDisplay = item.name.replace(regex, match => `<span class="highlight">${match}</span>`);
        }
        html += `<div class="item" data-uid="${item.uid}">
            <div class="name">${nameDisplay}</div>
            <div class="price-tag">${priceStr.join(' ')}</div>
            <div class="code">${item.id}</div>
        </div>`;
    });
    searchResults.innerHTML = html;
    searchResults.querySelectorAll('.item').forEach(el => {
        el.addEventListener('click', function() {
            const uid = this.dataset.uid;
            addItemByUid(uid);
            searchInput.value = '';
            searchResults.classList.remove('show');
        });
    });
    const items = searchResults.querySelectorAll('.item');
    if (items.length) {
        items[0].classList.add('active');
        activeIndex = 0;
    }
}
searchInput.addEventListener('keydown', function(e) {
    const items = searchResults.querySelectorAll('.item');
    if (!items.length) return;
    if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (activeIndex < items.length - 1) {
            if (activeIndex >= 0) items[activeIndex].classList.remove('active');
            activeIndex++;
            items[activeIndex].classList.add('active');
            items[activeIndex].scrollIntoView({ block: 'nearest' });
        }
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (activeIndex > 0) {
            items[activeIndex].classList.remove('active');
            activeIndex--;
            items[activeIndex].classList.add('active');
            items[activeIndex].scrollIntoView({ block: 'nearest' });
        }
    } else if (e.key === 'Enter') {
        e.preventDefault();
        if (activeIndex >= 0 && activeIndex < items.length) {
            const uid = items[activeIndex].dataset.uid;
            addItemByUid(uid);
            searchInput.value = '';
            searchResults.classList.remove('show');
        }
    } else if (e.key === 'Escape') {
        searchResults.classList.remove('show');
        searchInput.blur();
    }
});
searchInput.addEventListener('input', function() {
    const q = this.value;
    renderSearchResults(q);
    if (q.trim() === '') renderSearchResults('');
    searchResults.classList.add('show');
});
searchInput.addEventListener('focus', function() {
    if (this.value.trim() === '') renderSearchResults('');
    searchResults.classList.add('show');
});
document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-box')) searchResults.classList.remove('show');
});

// ===== 下载套餐 =====
function downloadPackage() {
    const selectedItems = selectedIds.map(uid=>findItem(uid)).filter(Boolean);
    const mandatory = getMandatoryItems();

    const filteredItems = allItems;
    if(filteredItems.length===0){ alert('请先添加项目！'); return; }

    const startRow = 2;
    const endRow = startRow + filteredItems.length - 1;
    const noDiscRow = endRow + 1;
    const totalRow = endRow + 2;
    const discRow = endRow + 3;
    const rateRow = endRow + 4;

    const colM = 'F';
    const colF = 'G';
    const colFM = 'H';
    const colFlag = 'I';

    const maleTotalFormula = `=SUM(${colM}${startRow}:${colM}${endRow})`;
    const femaleTotalFormula = `=SUM(${colF}${startRow}:${colF}${endRow})`;
    const femaleMarriedTotalFormula = `=SUM(${colFM}${startRow}:${colFM}${endRow})`;

    const noDiscMaleFormula = `=SUMIF(${colFlag}${startRow}:${colFlag}${endRow},"无折扣",${colM}${startRow}:${colM}${endRow})`;
    const noDiscFemaleFormula = `=SUMIF(${colFlag}${startRow}:${colFlag}${endRow},"无折扣",${colF}${startRow}:${colF}${endRow})`;
    const noDiscFemaleMarriedFormula = `=SUMIF(${colFlag}${startRow}:${colFlag}${endRow},"无折扣",${colFM}${startRow}:${colFM}${endRow})`;

    const discFemale = parseFloat(document.getElementById('discountFemale')?.value)||0;
    const discFemaleMarried = parseFloat(document.getElementById('discountFemaleMarried')?.value)||0;

    const maleRateFormula = `=IFERROR((${colM}${discRow} - ${colM}${noDiscRow}) / (${colM}${totalRow} - ${colM}${noDiscRow}), 0)`;
    const femaleRateFormula = `=IFERROR((${colF}${discRow} - ${colF}${noDiscRow}) / (${colF}${totalRow} - ${colF}${noDiscRow}), 0)`;
    const femaleMarriedRateFormula = `=IFERROR((${colFM}${discRow} - ${colFM}${noDiscRow}) / (${colFM}${totalRow} - ${colFM}${noDiscRow}), 0)`;

    let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8">
<style>
    td { mso-number-format:"0.00"; }
    .rate { mso-number-format:"0.00%"; }
    .hidden-col { display: none !important; visibility: hidden !important; width: 0px !important; mso-width-source: userset; mso-width: 0 !important; padding: 0 !important; border: none !important; font-size: 0px !important; }
</style>
</head><body><table border="1" cellpadding="3" style="font-size:12px; font-family: Arial, sans-serif;">
    <colgroup>
        <col style="width: 30px;">
        <col style="width: 80px;">
        <col style="width: 120px;">
        <col style="width: 120px;">
        <col style="width: 180px;">
        <col style="width: 70px;">
        <col style="width: 70px;">
        <col style="width: 70px;">
        <col class="hidden-col">
    </colgroup>`;

    html += `<tr>
        <th>序号</th><th>项目编码</th><th>项目名称</th><th>细项</th><th>临床意义</th>
        <th>男性价格</th><th>未婚女价格</th><th>已婚女价格</th>
        <th class="hidden-col"></th>
    </tr>`;

    filteredItems.forEach((item, idx) => {
        const itemsStr = Array.isArray(item.items) ? item.items.join('、') : item.items || '';
        const priceM = (item.priceM !== null && item.priceM !== undefined) ? item.priceM : '';
        const priceF = (item.priceF !== null && item.priceF !== undefined) ? item.priceF : '';
        const priceFM = (item.priceFM !== null && item.priceFM !== undefined) ? item.priceFM : '';
        const name = item.name;
        const isNoDiscTag = isNoDiscount(item) ? '无折扣' : '';
        let displayId = item.id;
        if (item.name === '营养早餐' && item.remark === '满赠') displayId = 'GP230303406';
        html += `<tr>
            <td style="mso-number-format:0;">${idx+1}</td>
            <td>${displayId}</td>
            <td>${name}</td>
            <td>${itemsStr}</td>
            <td>${item.meaning||''}</td>
            <td>${priceM}</td>
            <td>${priceF}</td>
            <td>${priceFM}</td>
            <td class="hidden-col">${isNoDiscTag}</td>
        </tr>`;
    });

    html += `<tr><td colspan="5" style="text-align:right;">无折扣项目总价</td>
        <td>${noDiscMaleFormula}</td>
        <td>${noDiscFemaleFormula}</td>
        <td>${noDiscFemaleMarriedFormula}</td>
        <td class="hidden-col"></td></tr>`;
    html += `<tr><td colspan="5" style="text-align:right;">门市价合计</td>
        <td>${maleTotalFormula}</td>
        <td>${femaleTotalFormula}</td>
        <td>${femaleMarriedTotalFormula}</td>
        <td class="hidden-col"></td></tr>`;
    html += `<tr><td colspan="5" style="text-align:right;">优惠价</td>
        <td>${discMale.toFixed(2)}</td>
        <td>${discFemale.toFixed(2)}</td>
        <td>${discFemaleMarried.toFixed(2)}</td>
        <td class="hidden-col"></td></tr>`;
    html += `<tr><td colspan="5" style="text-align:right;">折扣</td>
        <td class="rate">${maleRateFormula}</td>
        <td class="rate">${femaleRateFormula}</td>
        <td class="rate">${femaleMarriedRateFormula}</td>
        <td class="hidden-col"></td></tr>`;

    html += `<tr><td colspan="8" style="text-align:left;font-size:12px;background:#fcfcfc;border-top:2px solid #d0d9e5;padding:4px 8px;color:#e74c3c;">备注：套餐导入系统时</td><td class="hidden-col"></td></tr>`;
    html += `<tr><td colspan="8" style="text-align:left;font-size:12px;background:#fcfcfc;padding:4px 8px;">1、删除序号列</td><td class="hidden-col"></td></tr>`;
    html += `<tr><td colspan="8" style="text-align:left;font-size:12px;background:#fcfcfc;padding:4px 8px;">2、删除"细项"，"临床意义"列清除内容或删除后男性列左侧新增空白行。</td><td class="hidden-col"></td></tr>`;
    html += `<tr><td colspan="8" style="text-align:left;font-size:12px;background:#fcfcfc;padding:4px 8px;">3、男女有价格的项目统一更换为文字"是"。</td><td class="hidden-col"></td></tr>`;
    html += `<tr><td colspan="8" style="text-align:left;font-size:12px;background:#fcfcfc;padding:4px 8px;">4、"报告咨询、无折扣项目总价、门市价、优惠价、折扣"这5行，包括备注开始以下行都删除或复制时排除。</td><td class="hidden-col"></td></tr>`;
    html += `<tr><td colspan="8" style="text-align:left;font-size:12px;background:#fcfcfc;padding:4px 8px;border-bottom:1px solid #d0d9e5;">5、复制以上操作后的内容粘贴导入模板即可系统导入套餐。</td><td class="hidden-col"></td></tr>`;
    html += `<tr><td colspan="8" style="text-align:left;font-size:12px;background:#fcfcfc;padding:4px 8px;">联系人：</td><td class="hidden-col"></td></tr>`;
    html += `<tr><td colspan="8" style="text-align:left;font-size:12px;background:#fcfcfc;padding:4px 8px;">联系电话：</td><td class="hidden-col"></td></tr>`;
    html += `<tr><td colspan="8" style="text-align:left;font-size:12px;background:#fcfcfc;padding:4px 8px;">美年大健康产业控股股份有限公司</td><td class="hidden-col"></td></tr>`;
    html += `<tr><td colspan="8" style="text-align:left;font-size:12px;background:#fcfcfc;padding:4px 8px;">石家庄桥西门诊部：河北省石家庄市桥西区友谊北大街75号</td><td class="hidden-col"></td></tr>`;
    html += `<tr><td colspan="8" style="text-align:left;font-size:12px;background:#fcfcfc;padding:4px 8px;">石家庄长安门诊部：河北省石家庄市长安区东大街9号</td><td class="hidden-col"></td></tr>`;
    const blob = new Blob([html], {type: 'application/vnd.ms-excel;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '体检套餐.xls';
    a.click();
    URL.revokeObjectURL(a.href);
}

function renderRulesTable() {
    const tbody = document.getElementById('rulesTableBody');
    let html = '';
    RULES_DATA.forEach((item) => {
        const codeDisplay = item.codes.join('<br>');
        const nameDisplay = item.names.join('<br>');
        let tagClass = 'tag-required';
        if (item.tag === '可选') tagClass = 'tag-optional';
        else if (item.tag === '三选一') tagClass = 'tag-optional';
        else if (item.tag === '必选+2选1') tagClass = 'tag-required';
        html += `<tr><td class="code-cell">${codeDisplay}</td><td class="name-cell">${nameDisplay}</td><td class="rule-cell">${item.rule} <span class="${tagClass}">${item.tag}</span></td></tr>`;
    });
    tbody.innerHTML = html;
}

// ============================================================
// ★★★ 应用初始化（修复自动云同步） ★★★
// ============================================================
async function initApp() {
    renderRulesTable();
    updateSchemeSelect();
    renderMaster('');
    loadDefaultSelection();
    setGenderFilter('all');

    // 首次从云端加载（使用变化检测）
    const cloudResult = await CloudSync.load();
    if (cloudResult && cloudResult.data) {
        const changed = applyAppState(cloudResult.data);
        if (changed) {
            CloudSync.lastTimestamp = cloudResult.timestamp;
        }
    }

    // 定时轮询（使用变化检测）
    setInterval(async () => {
        if (document.activeElement && document.activeElement.closest('#masterBody')) return;
        const result = await CloudSync.load();
        if (result && result.data) {
            const changed = applyAppState(result.data);
            if (changed) {
                CloudSync.lastTimestamp = result.timestamp;
            }
        }
    }, SYNC_CONFIG.syncInterval);
}

initApp();
